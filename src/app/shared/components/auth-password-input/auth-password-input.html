<div class="flex flex-col gap-1.5">
    <label class="font-geist-mono font-medium" for="{{id}}">{{label}}</label>
    <div class="border border-gray-200 p-2.5 h-[46px] w-full relative">
        <input class="outline-none w-full placeholder:font-geist-mono placeholder:text-gray-400" [type]="seePassword() ? 'text' : 'password'" name="{{name}}" id="{{id}}" placeholder="{{placeholder}}">
        <i (click)="togglePasswordVisabilty()"   
        [class.fa-eye-slash]="!seePassword()" 
        [class.fa-eye]="seePassword()" 
        class="fa-regular absolute right-2 top-1/2 -translate-y-1/2 cursor-pointer text-gray-400"></i>
    </div>
</div>
